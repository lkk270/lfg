name: macOS

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The CI tests on macOS, off the PR path: its runners can queue long enough to be cancelled.
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Omnigraph CLI (the Knowledge pack's; the knowledge-sync tests run it against a throwaway store)
        run: |
          # Pinned: LFG speaks Omnigraph 0.13. 0.14 dropped --store and moves the cluster's storage on upgrade.
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) asset=omnigraph-linux-x86_64 ;; macOS-ARM64) asset=omnigraph-macos-arm64 ;;
            *) echo "no Omnigraph 0.13 build for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          base=https://github.com/ModernRelay/omnigraph/releases/download/v0.13.0
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$asset.tar.gz" "$base/$asset.tar.gz" && curl -fsSL -o "$asset.sha256" "$base/$asset.sha256"
          [ "$(awk '{print $1}' "$asset.sha256")" = "$(shasum -a 256 "$asset.tar.gz" | awk '{print $1}')" ]
          mkdir -p og && tar -xzf "$asset.tar.gz" -C og
          bin="$RUNNER_TEMP/$(find og -type f -name omnigraph | head -1)" && chmod +x "$bin" && dirname "$bin" >> "$GITHUB_PATH"
          "$bin" version
      - name: Unit and install-flow tests (sandboxed HOME, fake claude)
        run: python -m unittest discover -s tests -v
      - name: Installer dry run changes nothing
        run: |
          export HOME="$(mktemp -d)"
          ./install.sh --dry-run
          test -z "$(ls -A "$HOME")" || { echo "dry run wrote to HOME:"; ls -la "$HOME"; exit 1; }
