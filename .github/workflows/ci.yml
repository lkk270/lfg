name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Linux, because GitHub's macOS runners sit queued for so long they get cancelled (no runner within the
    # timeout), which reads as a failure. macos.yml runs the same tests on macOS weekly and on demand.
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Omnigraph CLI (the Knowledge pack's; the knowledge-sync tests run it against a throwaway store)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"; fi
          brew install ModernRelay/tap/omnigraph && omnigraph version
      - name: Unit and install-flow tests (sandboxed HOME, fake claude)
        run: python -m unittest discover -s tests -v
      - name: Installer dry run changes nothing
        if: runner.os == 'macOS'  # the installer refuses Linux; macos.yml runs this step
        run: |
          export HOME="$(mktemp -d)"
          ./install.sh --dry-run
          test -z "$(ls -A "$HOME")" || { echo "dry run wrote to HOME:"; ls -la "$HOME"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: ruff
        run: pipx run ruff check plugin/lib plugin/bin/lfg tests
      - name: shellcheck
        run: shellcheck install.sh bootstrap.sh
      - name: JSON manifests parse
        run: |
          for f in plugin/.claude-plugin/*.json plugin/hooks/hooks.json plugin/.mcp.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "bad JSON: $f"; exit 1; }
          done
