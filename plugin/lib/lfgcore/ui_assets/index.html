<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LFG</title>
<link rel="stylesheet" href="/assets/app.css">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
</head>
<body>
<aside class="side" aria-label="Sidebar">
  <div class="workspace">
    <a class="brand" href="#lfg" aria-label="LFG home"><img src="/assets/logo.svg" alt="" width="20" height="20"></a>
    <label class="switch" title="Project"><span class="sr">Project</span><select id="repo"></select></label>
  </div>
  <label class="switch branch" title="Branch"><span class="sr">Branch</span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9"/></svg><select id="branch"></select></label>
  <nav id="nav" aria-label="Main"></nav>
  <div class="side-foot">
    <div class="status" id="map-status" title="The code map LFG's agents read instead of whole files"></div>
    <div class="side-ver" id="side-ver"><span class="side-ver-n">LFG</span></div>
  </div>
</aside>
<div class="main">
  <header class="topbar"><button class="icon-btn side-tog" id="side-tog" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM9.5 4v16"/></svg></button><span class="history"><button class="hist" id="back" title="Back" aria-label="Back"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><button class="hist" id="forward" title="Forward" aria-label="Forward"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></span><nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav><span class="grow"></span><span class="muted small" id="lfg-version" title="Checked every 10 minutes against your fork and the original LFG"></span><span class="muted small" id="refreshed"></span><button class="btn small" id="refresh" title="Load this page again, including what GitHub says">Refresh</button>
    <button class="icon-btn guide-btn" id="guide-btn" aria-label="How to set up LFG" title="How to set up LFG"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 11v5.5M12 7.6v.01"/></svg></button>
    <a class="top-sess" href="#sessions"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM7.5 10l2.5 2-2.5 2M12 15h4"/></svg>Studio<span class="top-sess-n" id="top-sess-n" hidden></span></a>
    <button class="btn small tour-btn" id="tour-btn" hidden title="What's on this page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.5 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-.9.8-.9 1.4V14M12 17h.01"/></svg>Tour</button>
    <div class="bell"><button class="icon-btn" id="bell" aria-label="Notifications" aria-haspopup="true" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="bell-n" id="bell-n" hidden></span></button>
      <div class="bell-pop" id="bell-pop" hidden></div></div></header>
  <div id="update-banner" hidden></div>
  <div id="promo" class="promo-slot"></div>
  <main id="view" class="view" tabindex="-1"><div class="sk-page" aria-busy="true" aria-label="Loading"><div class="skeleton" style="width:30%;height:28px;margin-top:4px"></div><div class="skeleton" style="width:55%;height:14px;margin-top:10px"></div><div class="sk-box"><div class="sk-row"><div class="skeleton" style="width:46%"></div><div class="skeleton" style="width:12%"></div></div><div class="sk-row"><div class="skeleton" style="width:38%"></div><div class="skeleton" style="width:12%"></div></div><div class="sk-row"><div class="skeleton" style="width:52%"></div><div class="skeleton" style="width:12%"></div></div></div></div></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="drawer" id="drawer" hidden>
  <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-head"><div id="drawer-title"></div><button class="icon-btn" id="drawer-close" aria-label="Close">&times;</button></div>
    <div class="drawer-body" id="drawer-body"></div>
  </div>
</div>
<script src="/assets/app.js"></script>
</body>
</html>
