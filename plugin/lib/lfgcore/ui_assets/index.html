<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LFG</title>
<link rel="stylesheet" href="/assets/app.css">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
</head>
<body>
<aside class="side" aria-label="Sidebar">
  <div class="workspace">
    <a class="brand" href="#home" aria-label="LFG home"><img src="/assets/logo.svg" alt="" width="20" height="20"></a>
    <label class="switch" title="Project"><span class="sr">Project</span><select id="repo"></select></label>
  </div>
  <label class="switch branch" title="Branch"><span class="sr">Branch</span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9"/></svg><select id="branch"></select></label>
  <nav id="nav" aria-label="Main"></nav>
  <div class="side-foot">
    <div class="status" id="map-status" title="The code map LFG's agents read instead of whole files"></div>
    <div class="credit">LFG · runs only on this computer</div>
  </div>
</aside>
<div class="main">
  <header class="topbar"><span class="history"><button class="hist" id="back" title="Back" aria-label="Back"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><button class="hist" id="forward" title="Forward" aria-label="Forward"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></span><nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav><span class="grow"></span><span class="muted small" id="lfg-version" title="Checked every 10 minutes against your fork and the original LFG"></span><span class="muted small" id="refreshed"></span><button class="btn small" id="refresh" title="Load this page again, including what GitHub says">Refresh</button></header>
  <div id="update-banner" hidden></div>
  <div id="promo" class="promo-slot"></div>
  <main id="view" class="view" tabindex="-1"><div class="sk-page" aria-busy="true" aria-label="Loading"><div class="skeleton" style="width:30%;height:28px;margin-top:4px"></div><div class="skeleton" style="width:55%;height:14px;margin-top:10px"></div><div class="sk-box"><div class="sk-row"><div class="skeleton" style="width:46%"></div><div class="skeleton" style="width:12%"></div></div><div class="sk-row"><div class="skeleton" style="width:38%"></div><div class="skeleton" style="width:12%"></div></div><div class="sk-row"><div class="skeleton" style="width:52%"></div><div class="skeleton" style="width:12%"></div></div></div></div></main>
</div>
<div class="drawer" id="drawer" hidden>
  <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-head"><div id="drawer-title"></div><button class="icon-btn" id="drawer-close" aria-label="Close">&times;</button></div>
    <div class="drawer-body" id="drawer-body"></div>
  </div>
</div>
<script src="/assets/app.js"></script>
</body>
</html>
